version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      root-go-dependencies:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /desktop
    schedule:
      interval: monthly
    groups:
      desktop-go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

